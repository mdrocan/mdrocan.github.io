---
name: CI-check

on:
  push:
    branches-ignore:
      - master

  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
